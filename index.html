function parseCSVToData(csvText){
  const result=Papa.parse(csvText,{header:true,skipEmptyLines:true,transformHeader:h=>h.trim()});
  const rows=result.data;if(rows.length===0)throw new Error("CSV is empty");
  const cols=Object.keys(rows[0]);
  if(!cols.some(c=>c.toLowerCase()==="organisation"))throw new Error("Missing column: Organisation");
  return rows.map(row=>{
    const norm=s=>s.toLowerCase().replace(/[\s/]+/g,"");
    const get=key=>{const f=Object.keys(row).find(k=>norm(k)===norm(key));return f?(row[f]||"").toString().trim():"";};
    const fuzzyGet=keys=>{for(const k of keys){const v=get(k);if(v)return v;}return"";};
    const marked=val=>{if(!val)return false;const v=val.toString().trim().toLowerCase();return v==="x"||v==="yes"||v==="1"||v.length>1;};
    const sector=get("Sector")||"Other";
    const sectorAliases={"supporting bodies":"Other","supporting body":"Other","other organisation":"Other","other organisations":"Other","other":"Other"};
    const validSector=sectorAliases[sector.toLowerCase().trim()]||SECTS.find(s=>s.toLowerCase()===sector.toLowerCase())||"Other";
    return{name:get("Organisation")||"Unnamed",sector:validSector,remit:fuzzyGet(["Remit","Remit/Specialisms","Remit / Specialisms"]),location:get("Location")||"Unknown",supplyChain:SC.filter(s=>marked(get(s))),materials:MATS.filter(m=>marked(get(m)))};
  }).filter(d=>d.name!=="Unnamed"&&d.name!=="Organisation");
}
function dataToCSV(data){return Papa.unparse(data.map(d=>{const row={Organisation:d.name,Sector:SECT_LABELS[d.sector]||d.sector,Remit:d.remit,Location:d.location};SC.forEach(s=>{row[s]=d.supplyChain.includes(s)?"x":"";});MATS.forEach(m=>{row[m]=d.materials.includes(m)?"x":"";});return row;}),{columns:CSV_HEADERS});}
function genTemplate(){return Papa.unparse([{Organisation:"Example Corp",Sector:"Industry",Remit:"SiC power modules",Location:"UK",Equipment:"","Substrate":"",Epiwafer:"","Device design":"x",Manufacturing:"x",Packaging:"x","End user":"",SiC:"x",GaN:"",Ga2O3:"",other:""}],{columns:CSV_HEADERS});}
/* ── Change ②: "Ecosystem at a Glance" computed from the loaded dataset ──
   Runs on the full dataset (not the filtered view), so cards update when a new
   CSV is uploaded but stay fixed while the user is filtering. */
const plural=(n,one,many)=>n===1?one:(many||one+"s");
const joinList=arr=>arr.length<=1?arr.join(""):arr.slice(0,-1).join(", ")+" and "+arr[arr.length-1];
function computeInsights(data){
  const total=data.length;
  const stageCount=s=>data.filter(d=>d.supplyChain.includes(s)).length;
  const stages=SC.map(s=>({stage:s,count:stageCount(s)}));
  /* Card 1 — End-user demand */
  const eu=stages.find(x=>x.stage==="End user").count;
  const euBy=SECTS.map(s=>({sector:s,count:data.filter(d=>d.sector===s&&d.supplyChain.includes("End user")).length})).filter(x=>x.count>0);
  const maxStage=Math.max(...stages.map(x=>x.count),0);
  const euDesc=eu===0?"No organisations are recorded at the End user stage in the current dataset.":
    `${eu} ${plural(eu,"organisation")} sit at the End user stage${eu===maxStage?", the most populated stage in the chain":""}`+
    (euBy.length>0?` (${joinList(euBy.map(x=>x.count+" "+SECT_LABELS[x.sector].toLowerCase()))}).`:".");
  /* Card 2 — Thinnest stage(s) */
  const minCount=Math.min(...stages.map(x=>x.count));
  const thin=stages.filter(x=>x.count===minCount).map(x=>x.stage);
  const rest=stages.filter(x=>x.count>minCount);
  const nextCount=rest.length?Math.min(...rest.map(x=>x.count)):null;
  const next=rest.filter(x=>x.count===nextCount).map(x=>x.stage);
  const ukThin=data.filter(d=>d.location==="UK"&&thin.some(s=>d.supplyChain.includes(s))).length;
  const thinDesc=total===0?"No data loaded.":
    `${joinList(thin)} ${thin.length>1?"have":"has"} the fewest players (${minCount})`+
    (next.length?`, followed by ${joinList(next)} (${nextCount}).`:".")+
    (minCount>0?` ${ukThin===0?"None":"Only "+ukThin} of ${thin.length>1?"these":"them"} ${ukThin===1?"is":"are"} UK-based.`:"");
  /* Card 3 — Academic coverage */
  const aca=data.filter(d=>d.sector==="Academic");
  const acaStages=SC.map(s=>({stage:s,count:aca.filter(d=>d.supplyChain.includes(s)).length}));
  const covered=acaStages.filter(x=>x.count>0).length;
  const top=[...acaStages].filter(x=>x.count>0).sort((a,b)=>b.count-a.count).slice(0,2);
  const acaDesc=aca.length===0?"No academic organisations in the current dataset.":
    `${aca.length} academic ${plural(aca.length,"group")} cover ${covered===SC.length?"the full chain":covered+" of "+SC.length+" stages"}`+
    (top.length?`, strongest at ${joinList(top.map(x=>x.stage+" ("+x.count+")"))}.`:".");
  /* Each card carries a membership predicate and a label so the Overview can open the organisation pop-up (change 6) */
  return[
    {icon:"🏭",title:"End-User Pull",desc:euDesc,color:C.teal,match:d=>d.supplyChain.includes("End user"),label:"End user stage",what:"is active at the End user stage"},
    {icon:"⚠️",title:thin.length>1?"Thinnest Stages":"Thinnest Stage: "+thin[0],desc:thinDesc,color:C.red,match:d=>thin.some(s=>d.supplyChain.includes(s)),label:joinList(thin)+(thin.length>1?" stages":" stage"),what:"is active at "+joinList(thin)},
    {icon:"🎓",title:"Academic Depth",desc:acaDesc,color:C.Academic,match:d=>d.sector==="Academic",label:"Academic organisations",what:"is an academic organisation"},
  ];
}

   useAll : true when the clicked figure was computed from the full dataset (everything on
            the Overview tab), so the list ignores the current filters */
const KIND_CAP={cell:"Organisations behind this cell",bar:"Organisations behind this bar",card:"Organisations behind this card"};
function OrgPopup({popup,filtered,DATA,sectF,matF,scF,search,onClose,onOpenOrg}){
  useEffect(()=>{const k=ev=>{if(ev.key==="Escape")onClose();};window.addEventListener("keydown",k);return()=>window.removeEventListener("keydown",k);},[onClose]);
  const base=popup.useAll?DATA:filtered;
  const rows=base.filter(popup.match);
  const all=DATA.filter(popup.match);
  const bySector=SECTS.map(x=>({s:x,n:all.filter(d=>d.sector===x).length})).filter(x=>x.n>0);
  const filterOn=!popup.useAll&&(sectF||matF||scF||search);
  const scope=filterOn?[sectF&&SECT_LABELS[sectF],matF&&MS[matF],scF,search&&`"${search}"`].filter(Boolean).join(" · "):"full dataset";
  const isCell=popup.kind==="cell";
  const stop=ev=>ev.stopPropagation();
  return(
    <div onClick={onClose} style={{position:"fixed",inset:0,background:"rgba(10,30,40,0.45)",display:"flex",alignItems:"center",justifyContent:"center",zIndex:1000,padding:24}}>
      <div onClick={stop} style={{background:C.card,borderRadius:14,boxShadow:"0 12px 40px rgba(0,40,60,0.25)",width:"100%",maxWidth:640,maxHeight:"85vh",display:"flex",flexDirection:"column",overflow:"hidden"}}>
        <div style={{padding:"18px 22px 12px",borderBottom:`1px solid ${C.bl}`,display:"flex",justifyContent:"space-between",alignItems:"flex-start",gap:12}}>
          <div>
            <div style={{fontSize:10,color:C.tm,fontWeight:700,textTransform:"uppercase",letterSpacing:1.2}}>{KIND_CAP[popup.kind]||KIND_CAP.bar}</div>
            <div style={{fontSize:17,fontWeight:700,color:C.tx,marginTop:2}}>{popup.title}</div>
            <div style={{fontSize:12,color:C.ts,marginTop:4}}><strong style={{color:rows.length===0?C.red:rows.length===1?C.amb:C.teal,fontFamily:mn}}>{rows.length}</strong> {popup.useAll?"in the full dataset":`in the current selection (${scope})`}</div>
          </div>
          <button onClick={onClose} title="Close" style={{background:"transparent",border:"none",color:C.tm,cursor:"pointer",fontSize:20,padding:4,lineHeight:1}}>✕</button>
        </div>
        <div style={{overflowY:"auto",padding:"8px 22px 16px"}}>
          {rows.length===0?(
            <div style={{padding:"18px 0 8px"}}>
              <div style={{fontSize:13,color:C.tx,fontWeight:600}}>No organisation in the {popup.useAll?"dataset":"current selection"} {popup.what}.</div>
              {filterOn&&all.length>0&&<div style={{fontSize:12,color:C.ts,marginTop:8,lineHeight:1.6}}>Across the full dataset there {all.length===1?"is":"are"} <strong style={{fontFamily:mn}}>{all.length}</strong> ({bySector.map(x=>`${x.n} ${SECT_LABELS[x.s]}`).join(", ")}). Clear the filters to see {all.length===1?"it":"them"}.</div>}
              {filterOn&&all.length===0&&isCell&&<div style={{fontSize:12,color:C.ts,marginTop:8}}>This is also a gap across the full dataset.</div>}
              {!filterOn&&isCell&&<div style={{fontSize:12,color:C.ts,marginTop:8}}>This is a gap across the whole ecosystem mapped so far.</div>}
            </div>
          ):rows.map((d,i)=>(
            <div key={i} onClick={()=>onOpenOrg(d)} title="Open in Explorer" style={{display:"flex",alignItems:"center",gap:12,padding:"10px 8px",borderBottom:i<rows.length-1?`1px solid ${C.bl}`:"none",cursor:"pointer",borderRadius:6}} onMouseEnter={ev=>{ev.currentTarget.style.background=C.tg;}} onMouseLeave={ev=>{ev.currentTarget.style.background="transparent";}}>
              <div style={{flex:1,minWidth:0}}>
                <div style={{fontSize:13,fontWeight:600,color:C.tx}}>{d.name}<span style={{fontSize:11,color:C.tm,fontWeight:400,marginLeft:8}}>{d.location==="Unknown"?"":d.location}</span></div>
                <div style={{fontSize:11,color:C.ts,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{d.remit||"—"}</div>
              </div>
              <Chip color={C[d.sector]} filled sm>{SECT_LABELS[d.sector]||d.sector}</Chip>
            </div>
          ))}
        </div>
        {rows.length>0&&<div style={{padding:"10px 22px",borderTop:`1px solid ${C.bl}`,fontSize:11,color:C.tm}}>Click an organisation to open it in the Explorer. Press Esc or click outside to close.</div>}
      </div>
    </div>
  );
}

/* ── Main App ── */
function App(){
  const[tab,setTab]=useState("overview");
  const[search,setSearch]=useState("");
  const[sectF,setSectF]=useState(null);
  const[matF,setMatF]=useState(null);
  const[scF,setScF]=useState(null);
  const[selOrg,setSelOrg]=useState(null);
  const[DATA,setDATA]=useState(DEFAULT_DATA);
  const[dataSource,setDataSource]=useState("default");
  const[uploadMsg,setUploadMsg]=useState(null);
  const[dragOver,setDragOver]=useState(false);
  const fileRef=useRef(null);
  const[guideStep,setGuideStep]=useState(0);
  const[popup,setPopup]=useState(null);
  useEffect(()=>{if(tab==="gaps"&&!guideSeenBefore()){markGuideSeen();setGuideStep(1);}},[tab]);
  const goTab=id=>{setTab(id);setPopup(null);};
  const guideAdvance=from=>{if(guideStep===from)setGuideStep(from<GUIDE_STEPS.length?from+1:0);};
  const closePopup=useCallback(()=>setPopup(null),[]);
  /* Pop-up builders (change 6). Every clickable figure describes itself with a predicate. */
  const matX=(node,color)=><span><span style={{color:C.tm,fontWeight:500}}> x </span><span style={{color}}>{node}</span></span>;
  const cellPopup=(s,m)=>({kind:"cell",title:<span>{s}{matX(MS[m],C[m])}</span>,what:`is active at ${s} with ${MS[m]}`,match:d=>d.supplyChain.includes(s)&&d.materials.includes(m)});
  const stagePopup=s=>({kind:"bar",title:s,what:`is active at the ${s} stage`,match:d=>d.supplyChain.includes(s)});
  const stageSectorPopup=(s,sec)=>({kind:"bar",title:<span>{s}{matX(SECT_LABELS[sec],C[sec])}</span>,what:`from ${SECT_LABELS[sec]} is active at the ${s} stage`,match:d=>d.supplyChain.includes(s)&&d.sector===sec});
  const materialPopup=m=>({kind:"bar",title:<span style={{color:C[m]}}>{ML[m]}</span>,what:`works with ${MS[m]}`,match:d=>d.materials.includes(m)});
  const locationPopup=loc=>({kind:"bar",title:loc==="Unknown"?"Location unspecified":loc,what:loc==="Unknown"?"has an unspecified location":`is located in ${loc}`,match:d=>d.location===loc||(loc==="Unknown"&&d.location==="Unspecified")});
  const statPopup=(label,match,what)=>({kind:"card",title:label,what,match,useAll:true});
  const openOrg=d=>{setPopup(null);setSelOrg(d);setTab("explorer");window.scrollTo({top:0,behavior:"smooth"});};

  const handleCSV=useCallback((file)=>{
    if(!file)return;const reader=new FileReader();
    reader.onload=(ev)=>{try{const parsed=parseCSVToData(ev.target.result);if(parsed.length===0)throw new Error("No valid rows");setDATA(parsed);setDataSource(file.name);setUploadMsg({type:"success",text:`Loaded ${parsed.length} organisations from ${file.name}`});setTab("overview");setSectF(null);setMatF(null);setScF(null);setSearch("");setSelOrg(null);}catch(err){setUploadMsg({type:"error",text:"Error: "+err.message});}};
    reader.readAsText(file);
  },[]);
  const handleDrop=useCallback((ev)=>{ev.preventDefault();setDragOver(false);const file=ev.dataTransfer?.files?.[0];if(file&&file.name.endsWith(".csv"))handleCSV(file);else setUploadMsg({type:"error",text:"Please drop a .csv file"});},[handleCSV]);
  const resetData=()=>{setDATA(DEFAULT_DATA);setDataSource("default");setUploadMsg({type:"success",text:"Reset to built-in dataset"});setSectF(null);setMatF(null);setScF(null);setSearch("");setSelOrg(null);};

  const filtered=useMemo(()=>DATA.filter(d=>{
    if(search&&!d.name.toLowerCase().includes(search.toLowerCase())&&!d.remit.toLowerCase().includes(search.toLowerCase()))return false;
    if(sectF&&d.sector!==sectF)return false;
    if(matF&&!d.materials.includes(matF))return false;
    if(scF&&!d.supplyChain.includes(scF))return false;
    return true;
  }),[search,sectF,matF,scF,DATA]);

  const heat=useMemo(()=>{const mx={};let max=0;SC.forEach(s=>{mx[s]={};MATS.forEach(m=>{const c=filtered.filter(d=>d.supplyChain.includes(s)&&d.materials.includes(m)).length;mx[s][m]=c;if(c>max)max=c;});});return{mx,max};},[filtered]);

  /* Overview charts use the full dataset (like the stat and insight cards): the Overview has no filter bar, so it shows the global picture and changes only on CSV upload / Reset */
  const scBarData=useMemo(()=>SC.map(s=>({
    label:s,
    values:[
      DATA.filter(d=>d.sector==="Industry"&&d.supplyChain.includes(s)).length,
      DATA.filter(d=>d.sector==="Academic"&&d.supplyChain.includes(s)).length,
      DATA.filter(d=>d.sector==="Other"&&d.supplyChain.includes(s)).length,
    ]
  })),[DATA]);

  const insights=useMemo(()=>computeInsights(DATA),[DATA]);
  const matBar=useMemo(()=>MATS.map(m=>({key:m,name:MS[m],full:ML[m],count:DATA.filter(d=>d.materials.includes(m)).length,fill:C[m]})),[DATA]);
  const hasF=sectF||matF||scF||search;
  const clearF=()=>{setSectF(null);setMatF(null);setScF(null);setSearch("");};

  const FilterBar=({hl})=>(
    <div style={{display:"flex",flexWrap:"wrap",gap:8,alignItems:"center",marginBottom:18,padding:hl?"6px 8px":0,...HL(hl)}}>
      <span style={{fontSize:10,color:C.tm,fontWeight:700,textTransform:"uppercase",letterSpacing:1.2}}>Sector</span>
      {SECTS.map(s=><Chip key={s} color={C[s]} filled={sectF===s} onClick={()=>{setSectF(sectF===s?null:s);if(sectF!==s)guideAdvance(1);}}>{SECT_LABELS[s]}</Chip>)}
      <span style={{width:1,height:18,background:C.bd,margin:"0 4px"}}/>
      <span style={{fontSize:10,color:C.tm,fontWeight:700,textTransform:"uppercase",letterSpacing:1.2}}>Material</span>
      {MATS.map(m=><Chip key={m} color={C[m]} filled={matF===m} onClick={()=>setMatF(matF===m?null:m)}>{MS[m]}</Chip>)}
      <span style={{width:1,height:18,background:C.bd,margin:"0 4px"}}/>
      <select value={scF||""} onChange={ev=>setScF(ev.target.value||null)} style={{background:C.card,color:C.tx,border:`1px solid ${C.bd}`,borderRadius:8,padding:"5px 10px",fontSize:12,cursor:"pointer"}}>
        <option value="">All stages</option>
        {SC.map(s=><option key={s} value={s}>{s}</option>)}
      </select>
      {search&&<span title="Search text set in the Explorer tab; it also filters this view" style={{display:"inline-flex",alignItems:"center",gap:6,fontSize:11,color:C.ts,background:C.bg,border:`1px solid ${C.bd}`,borderRadius:99,padding:"3px 10px"}}>Search: <strong style={{color:C.tx}}>"{search}"</strong><span onClick={()=>setSearch("")} title="Clear search" style={{cursor:"pointer",color:C.tm,fontWeight:700}}>✕</span></span>}
      {hasF&&<button onClick={clearF} style={{background:C.rb,color:C.red,border:`1px solid ${C.rr}`,borderRadius:8,padding:"4px 12px",fontSize:11,cursor:"pointer",fontWeight:600}}>Clear</button>}
      <span style={{marginLeft:"auto",fontSize:12,color:C.tm}}><strong style={{color:C.teal}}>{filtered.length}</strong> / {DATA.length}</span>
    </div>
  );

  /* ── Tabs ── */
  const Overview=()=>(
    <div>
      <div style={{display:"flex",gap:14,flexWrap:"wrap",marginBottom:24}}>
        {[{l:"Total Mapped",c:C.teal,f:d=>true,w:"is loaded"},{l:"Industry",c:C.Industry,f:d=>d.sector==="Industry",w:"is an industry organisation"},{l:"Academic",c:C.Academic,f:d=>d.sector==="Academic",w:"is an academic organisation"},{l:"Supporting Bodies",c:C.Other,f:d=>d.sector==="Other",w:"is a supporting body"},{l:"UK Industry",c:C.td,f:d=>d.sector==="Industry"&&d.location==="UK",w:"is a UK-based industry organisation"}].map(s=>({...s,v:DATA.filter(s.f).length})).map((s,i)=>(
          <Card key={i} onClick={()=>setPopup(statPopup(s.l,s.f,s.w))} title={`${s.l}: click to list organisations`} style={{flex:1,minWidth:120,textAlign:"center",padding:"18px 14px",cursor:"pointer"}}>
            <div style={{fontSize:34,fontWeight:800,color:s.c,lineHeight:1,fontFamily:mn}}>{s.v}</div>
            <div style={{fontSize:10,color:C.tm,marginTop:6,fontWeight:600,textTransform:"uppercase",letterSpacing:0.8}}>{s.l}</div>
          </Card>
        ))}
      </div>
      <div style={{display:"grid",gridTemplateColumns:"3fr 2fr",gap:16,marginBottom:20}}>
        <Card>
          <STitle sub="Organisations at each supply chain stage, by sector. Click a segment or a stage name to list them.">Supply Chain Distribution</STitle>
          <div style={{display:"flex",gap:8,marginBottom:10,justifyContent:"flex-end"}}>
            {["Industry","Academic","Other"].map(s=><span key={s} style={{display:"flex",alignItems:"center",gap:4,fontSize:10,color:C.ts}}><span style={{width:10,height:10,borderRadius:2,background:C[s],display:"inline-block"}}/>{SECT_LABELS[s]}</span>)}
          </div>
          <StackedBar data={scBarData} colors={[C.Industry,C.Academic,C.Other]} segLabels={SECTS.map(x=>SECT_LABELS[x])} onSeg={(i,j)=>setPopup({...stageSectorPopup(SC[i],SECTS[j]),useAll:true})} onRow={i=>setPopup({...stagePopup(SC[i]),useAll:true})}/>
        </Card>
        <Card>
          <STitle sub="Organisations working with each material system. Click a bar to list them.">Material Coverage</STitle>
          <div style={{display:"flex",flexDirection:"column",gap:12,marginTop:8}}>
            {matBar.map((m,i)=>{const mx=Math.max(...matBar.map(x=>x.count),1);return(
              <div key={i} onClick={()=>setPopup({...materialPopup(m.key),useAll:true})} title={`${m.full}: ${m.count}, click to list organisations`} style={{cursor:"pointer",borderRadius:8,padding:"4px 6px",margin:"-4px -6px"}} onMouseEnter={ev=>{ev.currentTarget.style.background=C.tg;}} onMouseLeave={ev=>{ev.currentTarget.style.background="transparent";}}>
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"baseline",marginBottom:4}}>
                  <span style={{fontSize:13,fontWeight:600,color:m.fill}}>{m.full}</span>
                  <span style={{fontSize:18,fontWeight:800,color:m.fill,fontFamily:mn}}>{m.count}</span>
                </div>
                <div style={{height:10,background:C.bg,borderRadius:99,overflow:"hidden"}}>
                  <div style={{height:"100%",width:(m.count/mx*100)+"%",background:m.fill,borderRadius:99,transition:"width 0.4s"}}/>
                </div>
              </div>
            );})}
          </div>
        </Card>
      </div>
      <Card>
        <STitle sub="Computed from the loaded dataset; updates when new data is uploaded. Click a card to list the organisations behind it.">Ecosystem at a Glance</STitle>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:14}}>
          {insights.map((c,i)=>(
            <div key={i} onClick={()=>setPopup(statPopup(c.label,c.match,c.what))} title={`Click to list: ${c.label}`} style={{padding:"16px 18px",background:c.color+"08",borderRadius:10,borderLeft:`3px solid ${c.color}`,cursor:"pointer",transition:"box-shadow 0.15s"}} onMouseEnter={ev=>{ev.currentTarget.style.boxShadow=`0 0 0 2px ${c.color}55`;}} onMouseLeave={ev=>{ev.currentTarget.style.boxShadow="none";}}>
              <div style={{fontSize:20,marginBottom:6}}>{c.icon}</div>
              <div style={{fontSize:13,fontWeight:700,color:C.tx,marginBottom:4}}>{c.title}</div>
              <div style={{fontSize:12,color:C.ts,lineHeight:1.55}}>{c.desc}</div>
            </div>
          ))}
        </div>
      </Card>
    </div>
  );

  const Explorer=()=>(
    <div>
      <div style={{marginBottom:14,position:"relative"}}>
        <input type="text" placeholder="Search by name or specialism..." value={search} onChange={ev=>setSearch(ev.target.value)} style={{width:"100%",padding:"11px 16px 11px 38px",background:C.card,border:`1.5px solid ${search?C.teal:C.bd}`,borderRadius:10,color:C.tx,fontSize:13,outline:"none",boxSizing:"border-box"}}/>
        <span style={{position:"absolute",left:12,top:"50%",transform:"translateY(-50%)",fontSize:16,opacity:0.4}}>🔍</span>
      </div>
      <FilterBar/>
      {selOrg&&(
        <Card style={{marginBottom:16,borderLeft:`4px solid ${C[selOrg.sector]}`,background:C[selOrg.sector]+"06"}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start"}}>
            <div>
              <div style={{fontSize:18,fontWeight:700,color:C.tx}}>{selOrg.name}</div>
              <div style={{display:"flex",gap:6,marginTop:6,flexWrap:"wrap",alignItems:"center"}}>
                <Chip color={C[selOrg.sector]} filled>{SECT_LABELS[selOrg.sector]||selOrg.sector}</Chip>
                {selOrg.location!=="Unknown"&&<span style={{fontSize:11,color:C.ts}}>📍 {selOrg.location}</span>}
              </div>
            </div>
            <button onClick={()=>setSelOrg(null)} style={{background:"transparent",border:"none",color:C.tm,cursor:"pointer",fontSize:18,padding:4}}>✕</button>
          </div>
          <p style={{color:C.ts,fontSize:13,margin:"10px 0 12px",lineHeight:1.6}}>{selOrg.remit}</p>
          <div style={{display:"flex",gap:24,flexWrap:"wrap"}}>
            <div><div style={{fontSize:10,color:C.tm,fontWeight:700,textTransform:"uppercase",letterSpacing:1,marginBottom:5}}>Supply Chain</div><div style={{display:"flex",gap:4,flexWrap:"wrap"}}>{selOrg.supplyChain.length>0?selOrg.supplyChain.map(s=><Chip key={s} color={C.teal} filled sm>{s}</Chip>):<span style={{fontSize:11,color:C.tm}}>Not specified</span>}</div></div>
            <div><div style={{fontSize:10,color:C.tm,fontWeight:700,textTransform:"uppercase",letterSpacing:1,marginBottom:5}}>Materials</div><div style={{display:"flex",gap:4,flexWrap:"wrap"}}>{selOrg.materials.length>0?selOrg.materials.map(m=><Chip key={m} color={C[m]} filled sm>{MS[m]}</Chip>):<span style={{fontSize:11,color:C.tm}}>Not specified</span>}</div></div>
          </div>
        </Card>
      )}
      <Card style={{padding:0,overflow:"hidden"}}>
        <div style={{overflowX:"auto"}}>
          <table style={{width:"100%",borderCollapse:"collapse",fontSize:12}}>
            <thead><tr style={{background:C.bg}}>
              {["Organisation","Sector","Location","Specialism","Supply Chain","Materials"].map(h=>(
                <th key={h} style={{textAlign:"left",padding:"10px 14px",color:C.tm,fontSize:10,textTransform:"uppercase",letterSpacing:1.2,fontWeight:700,borderBottom:`2px solid ${C.bd}`}}>{h}</th>
              ))}
            </tr></thead>
            <tbody>{filtered.map((d,i)=>(
              <tr key={i} onClick={()=>setSelOrg(d)} style={{cursor:"pointer",borderBottom:`1px solid ${C.bl}`}} onMouseEnter={ev=>{ev.currentTarget.style.background=C.tg;}} onMouseLeave={ev=>{ev.currentTarget.style.background="transparent";}}>
                <td style={{padding:"10px 14px",color:C.tx,fontWeight:600}}>{d.name}</td>
                <td style={{padding:"10px 14px"}}><Chip color={C[d.sector]} sm filled>{SECT_LABELS[d.sector]||d.sector}</Chip></td>
                <td style={{padding:"10px 14px",color:C.ts}}>{d.location==="Unknown"?"—":d.location}</td>
                <td style={{padding:"10px 14px",color:C.ts,maxWidth:260,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{d.remit||"—"}</td>
                <td style={{padding:"10px 14px"}}><div style={{display:"flex",gap:3,flexWrap:"wrap"}}>{d.supplyChain.slice(0,2).map(s=><Chip key={s} color={C.teal} sm>{s}</Chip>)}{d.supplyChain.length>2&&<span style={{fontSize:10,color:C.tm}}>+{d.supplyChain.length-2}</span>}</div></td>
                <td style={{padding:"10px 14px"}}><div style={{display:"flex",gap:4}}>{d.materials.map(m=><span key={m} style={{width:10,height:10,borderRadius:"50%",background:C[m],display:"inline-block",border:"2px solid #fff",boxShadow:`0 0 0 1px ${C[m]}44`}} title={MS[m]}/>)}</div></td>
              </tr>
            ))}</tbody>
          </table>
        </div>
        {filtered.length>0&&<div style={{padding:14,textAlign:"center",color:C.tm,fontSize:12,borderTop:`1px solid ${C.bl}`}}>Showing {filtered.length} of {DATA.length} organisations</div>}
        {filtered.length===0&&<div style={{padding:48,textAlign:"center",color:C.tm}}>No matches. <button onClick={clearF} style={{color:C.teal,background:"none",border:"none",cursor:"pointer",fontWeight:600,textDecoration:"underline"}}>Reset</button></div>}
      </Card>
    </div>
  );

  const Gaps=()=>{
    const gaps=[],weak=[];
    SC.forEach(s=>MATS.forEach(m=>{const c=heat.mx[s]?.[m]||0;if(c===0)gaps.push({s,m});else if(c===1)weak.push({s,m});}));
    const gs=guideStep,tgt=gs>0?GUIDE_STEPS[gs-1].target:null;
    const listsEmpty=gaps.length===0&&weak.length===0;
    const guide=t=>tgt===t&&<GuideBox step={gs} total={GUIDE_STEPS.length} onNext={()=>setGuideStep(gs+1)} onBack={()=>setGuideStep(gs-1)} onClose={()=>setGuideStep(0)} hint={t==="gaps"&&listsEmpty?"Both lists are empty for the current selection. Select a sector above to see its gaps here, or press Done.":undefined}/>;
    const scopeLabel=sectF?SECT_LABELS[sectF]:null;
    const sectN=sectF?DATA.filter(d=>d.sector===sectF).length:DATA.length;
    const rowItem=(g,i,gap)=>(
      <div key={i} onClick={()=>{setPopup(cellPopup(g.s,g.m));guideAdvance(3);}} title="Show the organisations behind this cell" style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"8px 12px",background:gap?C.rb:C.ab,borderRadius:8,border:gap?`1px solid ${C.rr}`:"1px solid rgba(239,108,0,0.15)",cursor:"pointer"}} onMouseEnter={ev=>{ev.currentTarget.style.boxShadow=`0 0 0 2px ${gap?C.red:C.amb}55`;}} onMouseLeave={ev=>{ev.currentTarget.style.boxShadow="none";}}>

        <span style={{fontSize:9,fontWeight:800,padding:"2px 8px",borderRadius:99,background:gap?C.red:C.amb,color:"#fff",letterSpacing:gap?1:0}}>{gap?"GAP":"1 ONLY"}</span>
      </div>

    return(
      <div>
        <div style={{display:"flex",alignItems:"flex-start",justifyContent:"space-between",gap:16,padding:"12px 16px",marginBottom:14,background:C.tg,border:`1px solid ${C.tb}`,borderLeft:`4px solid ${C.teal}`,borderRadius:10}}>
          <div style={{fontSize:12,color:C.ts,lineHeight:1.6}}>
            <strong style={{color:C.tx}}>{scopeLabel?`Showing gaps within ${scopeLabel} (${sectN} organisations).`:`Showing the whole ecosystem (${DATA.length} organisations).`}</strong>{" "}
            {scopeLabel?"Select another sector to compare, or Clear to return to the full picture. ":"Select a sector below to see the gaps within Industry, Academic or Supporting Bodies. "}Click any heatmap cell or list entry to see the organisations behind it.
          </div>
          <button onClick={()=>setGuideStep(gs>0?0:1)} style={{flexShrink:0,background:gs>0?C.teal:C.card,color:gs>0?"#fff":C.teal,border:`1.5px solid ${C.teal}`,borderRadius:8,padding:"6px 14px",fontSize:12,fontWeight:600,cursor:"pointer",whiteSpace:"nowrap"}}>{gs>0?"Hide guide":"Show guide"}</button>
        </div>
        <FilterBar hl={tgt==="filters"}/>
        {guide("filters")}
        <Card style={{marginBottom:18,...HL(tgt==="heatmap")}}>
          <STitle sub="Darker = more organisations. Red dashed = zero (gap). Amber = single player. Click a cell to list the organisations.">Supply Chain x Material Heatmap</STitle>
          {guide("heatmap")}
          <div style={{overflowX:"auto"}}>
            <table style={{width:"100%",borderCollapse:"separate",borderSpacing:5}}>
              <thead><tr><th style={{padding:10}}/>{MATS.map(m=><th key={m} style={{padding:10,textAlign:"center",fontSize:13,fontWeight:700,color:C[m]}}>{MS[m]}</th>)}<th style={{padding:10,textAlign:"center",fontSize:11,color:C.tm,fontWeight:700}}>Total</th></tr></thead>
              <tbody>{SC.map(s=>{const total=filtered.filter(d=>d.supplyChain.includes(s)).length;return(<tr key={s}><td style={{padding:"10px 14px",color:C.tx,fontSize:13,fontWeight:600,whiteSpace:"nowrap"}}>{s}</td>{MATS.map(m=><HeatCell key={m} count={heat.mx[s]?.[m]||0} max={heat.max} onClick={()=>{setPopup(cellPopup(s,m));guideAdvance(2);}} title={`${s} x ${MS[m]}: click to list organisations`}/>)}<td onClick={()=>setPopup(stagePopup(s))} title={`${s}: ${total}, click to list organisations`} style={{padding:"10px 14px",textAlign:"center",color:C.tm,fontSize:14,fontWeight:700,fontFamily:mn,cursor:"pointer"}}>{total}</td></tr>);})}</tbody>
            </table>
          </div>
        </Card>
        {guide("gaps")}
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:16,...HL(tgt==="gaps")}}>
          <Card><STitle sub={gaps.length+" zero-player combinations"}>Critical Gaps</STitle><div style={{display:"flex",flexDirection:"column",gap:6}}>{gaps.length>0?gaps.map((g,i)=>rowItem(g,i,true)):<p style={{color:C.tm,fontSize:12,margin:0}}>None with current filters.</p>}</div></Card>
          <Card><STitle sub={weak.length+" single-player combinations"}>Vulnerable Areas</STitle><div style={{display:"flex",flexDirection:"column",gap:6}}>{weak.length>0?weak.map((g,i)=>rowItem(g,i,false)):<p style={{color:C.tm,fontSize:12,margin:0}}>None with current filters.</p>}</div></Card>
        </div>
      </div>
    );
  };

  const ChainTab=()=>{
    const locData={};filtered.forEach(d=>{const l=d.location==="Unknown"?"Unspecified":d.location;locData[l]=(locData[l]||0)+1;});
    const locBar=Object.entries(locData).sort((a,b)=>b[1]-a[1]).map(([n,v])=>({label:n,loc:n==="Unspecified"?"Unknown":n,value:v,color:n==="UK"?C.teal:n==="Unspecified"?C.bd:C.Academic}));
    const maxSc=Math.max(...SC.map(s=>filtered.filter(d=>d.supplyChain.includes(s)).length),1);
    return(
      <div>
        <FilterBar/>
        <Card style={{marginBottom:18}}>
          <STitle sub="Upstream to Downstream. Red = low-density stages. Click a bar to list the organisations.">Supply Chain Pipeline</STitle>
          <div style={{display:"flex",flexDirection:"column",gap:3,marginTop:8}}>
            {SC.map(s=>{const count=filtered.filter(d=>d.supplyChain.includes(s)).length;const pct=(count/maxSc)*100;const isWeak=count<10;return(
              <div key={s} onClick={()=>setPopup(stagePopup(s))} title={`${s}: ${count}, click to list organisations`} style={{display:"flex",alignItems:"center",gap:12,cursor:"pointer",borderRadius:8,padding:"2px 4px"}} onMouseEnter={ev=>{ev.currentTarget.style.background=C.tg;}} onMouseLeave={ev=>{ev.currentTarget.style.background="transparent";}}>
                <div style={{width:110,fontSize:12,color:C.ts,textAlign:"right",fontWeight:600,flexShrink:0}}>{s}</div>
                <div style={{flex:1,height:32,background:C.bg,borderRadius:6,overflow:"hidden",border:`1px solid ${C.bl}`}}>
                  <div style={{width:Math.max(pct,3)+"%",height:"100%",borderRadius:5,background:isWeak?`linear-gradient(90deg,${C.red}cc,${C.red}88)`:`linear-gradient(90deg,${C.teal},${C.tl})`,display:"flex",alignItems:"center",paddingLeft:10,transition:"width 0.5s"}}>
                    <span style={{fontSize:12,fontWeight:700,color:"#fff",fontFamily:mn}}>{count}</span>
                  </div>
                </div>
                {isWeak?<span style={{fontSize:9,fontWeight:700,color:C.red,background:C.rb,padding:"2px 7px",borderRadius:99,whiteSpace:"nowrap"}}>Low density</span>:<span style={{width:68}}/>}
              </div>
            );})}
          </div>
        </Card>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:16}}>
          <Card><STitle sub="HQ or significant presence. Click a bar to list the organisations.">Geographic Distribution</STitle><HBar data={locBar} onClick={i=>setPopup(locationPopup(locBar[i].loc))}/></Card>
          <Card><STitle sub="Organisations spanning 3+ stages. Click a row to open it in the Explorer.">Top Vertically-Integrated Players</STitle>
            <div style={{display:"flex",flexDirection:"column",gap:4}}>
              {[...filtered].filter(d=>d.supplyChain.length>=3).sort((a,b)=>b.supplyChain.length-a.supplyChain.length).slice(0,10).map((d,i)=>(
                <div key={i} onClick={()=>openOrg(d)} title="Open in Explorer" style={{display:"flex",alignItems:"center",gap:10,padding:"6px 10px",borderRadius:6,background:i%2===0?C.tg:"transparent",cursor:"pointer"}} onMouseEnter={ev=>{ev.currentTarget.style.boxShadow=`inset 0 0 0 2px ${C.teal}55`;}} onMouseLeave={ev=>{ev.currentTarget.style.boxShadow="none";}}>
                  <span style={{fontSize:12,fontWeight:600,color:C.tx,minWidth:140}}>{d.name}</span>
                  <div style={{display:"flex",gap:3,flexWrap:"wrap",flex:1}}>{d.supplyChain.map(s=><Chip key={s} color={C.teal} sm>{s}</Chip>)}</div>
                  <Chip color={C[d.sector]} filled sm>{SECT_LABELS[d.sector]||d.sector}</Chip>
                </div>
              ))}
            </div>
          </Card>
        </div>
      </div>
    );
  };

  const DataTab=()=>(
    <div>
      <Card style={{marginBottom:18,background:dataSource==="default"?C.tg:C.gb,borderLeft:`4px solid ${dataSource==="default"?C.teal:C.green}`}}>
        <div style={{display:"flex",alignItems:"center",justifyContent:"space-between"}}>
          <div>
            <div style={{fontSize:14,fontWeight:700,color:C.tx}}>Current Data Source</div>
            <div style={{fontSize:13,color:C.ts,marginTop:2}}>{dataSource==="default"?`Built-in dataset: ${DATA.length} organisations`:`Custom CSV: ${dataSource} (${DATA.length} organisations)`}</div>
          </div>
          {dataSource!=="default"&&<button onClick={resetData} style={{background:C.card,color:C.teal,border:`1.5px solid ${C.teal}`,borderRadius:8,padding:"7px 16px",fontSize:12,fontWeight:600,cursor:"pointer"}}>Reset to Default</button>}
        </div>
      </Card>
      {uploadMsg&&(<div style={{marginBottom:16,padding:"12px 16px",borderRadius:10,background:uploadMsg.type==="success"?C.gb:C.rb,border:`1px solid ${uploadMsg.type==="success"?"rgba(46,125,50,0.15)":C.rr}`,display:"flex",justifyContent:"space-between",alignItems:"center"}}><span style={{fontSize:13,color:uploadMsg.type==="success"?C.green:C.red,fontWeight:500}}>{uploadMsg.text}</span><button onClick={()=>setUploadMsg(null)} style={{background:"none",border:"none",color:C.tm,cursor:"pointer",fontSize:16}}>✕</button></div>)}
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:16,marginBottom:20}}>
        <Card>
          <STitle sub="Upload a CSV to replace the dataset. All charts update instantly.">Upload New Data</STitle>
          <div onDragOver={ev=>{ev.preventDefault();setDragOver(true);}} onDragLeave={()=>setDragOver(false)} onDrop={handleDrop} onClick={()=>fileRef.current?.click()} style={{border:`2px dashed ${dragOver?C.teal:C.bd}`,borderRadius:12,padding:"40px 24px",textAlign:"center",cursor:"pointer",background:dragOver?"rgba(0,131,143,0.04)":"transparent"}}>
            <input ref={fileRef} type="file" accept=".csv" style={{display:"none"}} onChange={ev=>{if(ev.target.files?.[0])handleCSV(ev.target.files[0]);ev.target.value="";}}/>
            <div style={{fontSize:36,marginBottom:8}}>📄</div>
            <div style={{fontSize:14,fontWeight:600,color:C.tx}}>{dragOver?"Drop CSV here":"Drag and drop a CSV file"}</div>
            <div style={{fontSize:12,color:C.tm,marginTop:4}}>or click to browse</div>
          </div>
        </Card>
        <Card>
          <STitle sub="Download for updating or sharing">Download Options</STitle>
          <div style={{display:"flex",flexDirection:"column",gap:10}}>
            <button onClick={()=>dlFile(genTemplate(),"rewire_template.csv")} style={{display:"flex",alignItems:"center",gap:12,padding:"14px 18px",background:C.tg,border:`1.5px solid ${C.tb}`,borderRadius:10,cursor:"pointer",textAlign:"left"}}>
              <span style={{fontSize:28}}>📋</span><div><div style={{fontSize:13,fontWeight:700,color:C.teal}}>Download Blank Template</div><div style={{fontSize:11,color:C.ts}}>Empty CSV with example row</div></div>
            </button>
            <button onClick={()=>dlFile(dataToCSV(DATA),"rewire_ecosystem_data.csv")} style={{display:"flex",alignItems:"center",gap:12,padding:"14px 18px",background:C.tg,border:`1.5px solid ${C.tb}`,borderRadius:10,cursor:"pointer",textAlign:"left"}}>
              <span style={{fontSize:28}}>💾</span><div><div style={{fontSize:13,fontWeight:700,color:C.teal}}>Export Current Data</div><div style={{fontSize:11,color:C.ts}}>All {DATA.length} organisations as CSV</div></div>
            </button>
          </div>
        </Card>
      </div>
    </div>
  );

  return(
    <div style={{minHeight:"100vh",background:C.bg,color:C.tx,fontFamily:ft}}>
      <div style={{background:"#fff",borderBottom:`1px solid ${C.bd}`,padding:"0 32px"}}>
        <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"16px 0 0"}}>
          <div style={{display:"flex",alignItems:"center",gap:14}}>
            <div style={{width:42,height:42,borderRadius:10,background:`linear-gradient(135deg,${C.teal},${C.td})`,display:"flex",alignItems:"center",justifyContent:"center",boxShadow:`0 2px 8px ${C.teal}40`}}><span style={{fontSize:22,fontWeight:800,color:"#fff",fontFamily:mn}}>R</span></div>
            <div><h1 style={{margin:0,fontSize:19,fontWeight:700,color:C.tx,letterSpacing:-0.3}}>REWIRE Ecosystem Explorer</h1><p style={{margin:0,fontSize:12,color:C.tm}}>UK Wide Band Gap Power Semiconductor Landscape</p></div>
          </div>
          <div style={{display:"flex",alignItems:"center",gap:16}}>
            {dataSource!=="default"&&<Chip color={C.green} filled sm>Custom Data</Chip>}
            <div style={{textAlign:"right"}}><div style={{fontSize:10,color:C.tm,textTransform:"uppercase",letterSpacing:1}}>Organisations</div><div style={{fontSize:22,fontWeight:800,color:C.teal,fontFamily:mn}}>{DATA.length}</div></div>
          </div>
        </div>
        <div style={{display:"flex",gap:0,marginTop:12}}>
          {TABS.map(t=>(<button key={t.id} onClick={()=>goTab(t.id)} style={{padding:"10px 22px",background:"transparent",border:"none",borderBottom:tab===t.id?`3px solid ${C.teal}`:"3px solid transparent",color:tab===t.id?C.teal:C.tm,fontSize:13,fontWeight:tab===t.id?700:500,cursor:"pointer",transition:"all 0.15s"}}>{t.label}</button>))}
        </div>
      </div>
      <div style={{padding:"22px 32px 32px",maxWidth:1200,margin:"0 auto"}}>
        {tab==="overview"&&Overview()}
        {tab==="explorer"&&Explorer()}
        {tab==="gaps"&&Gaps()}
        {tab==="chain"&&ChainTab()}
        {tab==="data"&&DataTab()}
      </div>
      {popup&&<OrgPopup popup={popup} filtered={filtered} DATA={DATA} sectF={sectF} matF={matF} scF={scF} search={search} onClose={closePopup} onOpenOrg={openOrg}/>}
      <div style={{padding:"14px 32px",borderTop:`1px solid ${C.bd}`,background:"#fff",textAlign:"center",fontSize:10,color:C.tm}}>
        REWIRE Innovation and Knowledge Centre - University of Bristol - Student Challenge 2026
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
