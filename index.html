function normCountry(raw){

  if(COUNTRY_ALIASES[low])return{country:COUNTRY_ALIASES[low],place:""};

/* ── Automatic location lookup for uploaded data (change 7) ──
   Fills lat/lng for sites that have none: UK postcodes and UK place names via postcodes.io,
   US ZIP codes via zippopotam.us, US state names from the table above, anything else via
   Nominatim (write overseas sites as "City, Country" in the City column). Coordinates are written
   into the exported CSV, so a dataset only needs looking up once. Runs in the browser after
   upload; if a service is unreachable the affected organisations are listed beside the map. */
const GEO_CACHE={};
const fetchJSON=(url,opts)=>fetch(url,opts).then(r=>r.ok?r.json():Promise.reject(new Error("HTTP "+r.status)));
async function lookupUKPostcodes(pcs){
  const need=pcs.filter(p=>!(p in GEO_CACHE));
  for(let i=0;i<need.length;i+=100){
    const chunk=need.slice(i,i+100);
    try{const res=await fetchJSON("https://api.postcodes.io/postcodes",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({postcodes:chunk})});
      (res.result||[]).forEach(r=>{GEO_CACHE[r.query]=r.result?[r.result.latitude,r.result.longitude]:null;});
    }catch(e){/* leave uncached; retried on the next upload */}
    /* terminated postcodes still have coordinates */
    for(const p of chunk){if(GEO_CACHE[p]===null){try{const t=await fetchJSON("https://api.postcodes.io/terminated_postcodes/"+encodeURIComponent(p));if(t.result)GEO_CACHE[p]=[t.result.latitude,t.result.longitude];}catch(e){}}}
  }
}
async function lookupUKPlace(name){
  const key="place:"+name.toLowerCase();
  if(key in GEO_CACHE)return GEO_CACHE[key];
  try{const res=await fetchJSON("https://api.postcodes.io/places?q="+encodeURIComponent(name)+"&limit=5");
    /* prefer an exact name, then a city over a town over a village; "Newcastle" → Newcastle upon Tyne, not a hamlet */
    const q=name.toLowerCase();
    const score=r=>{const n=(r.name_1||"").toLowerCase(),t=r.local_type||"";return(n===q?4:n.startsWith(q)?2:0)+(/city/i.test(t)?3:/town/i.test(t)?2:0);};
    const pick=(res.result||[]).slice().sort((a,b)=>score(b)-score(a))[0];
    GEO_CACHE[key]=pick?[pick.latitude,pick.longitude]:null;
  }catch(e){GEO_CACHE[key]=undefined;}
  return GEO_CACHE[key];
}
async function lookupUSZip(zip){
  const key="zip:"+zip;
  if(key in GEO_CACHE)return GEO_CACHE[key];
  try{const res=await fetchJSON("https://api.zippopotam.us/us/"+zip);const p=res.places&&res.places[0];GEO_CACHE[key]=p?[parseFloat(p.latitude),parseFloat(p.longitude)]:null;}catch(e){GEO_CACHE[key]=undefined;}
  return GEO_CACHE[key];
}
/* Anything else (overseas cities, "City, Country") goes to Nominatim, OpenStreetMap's geocoder.
   Its usage policy allows light use at no more than one request per second, so calls are queued. */
let nominatimQueue=Promise.resolve();
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
function lookupNominatim(query,iso){
  const key="nom:"+query.toLowerCase()+(iso?"|"+iso:"");
  if(key in GEO_CACHE)return Promise.resolve(GEO_CACHE[key]);
  const run=nominatimQueue.then(async()=>{
    try{const res=await fetchJSON("https://nominatim.openstreetmap.org/search?format=jsonv2&limit=1"+(iso?"&countrycodes="+iso:"")+"&q="+encodeURIComponent(query),{headers:{"Accept-Language":"en"}});
      const hit=Array.isArray(res)&&res[0];GEO_CACHE[key]=hit?[parseFloat(hit.lat),parseFloat(hit.lon)]:null;
    }catch(e){GEO_CACHE[key]=undefined;}
    await sleep(1100);
    return GEO_CACHE[key];
  });
  nominatimQueue=run.catch(()=>{});
  return run;
}
async function geocodeData(data){
  const out=data.map(d=>({...d,sites:(d.sites||[]).map(s=>({...s}))}));
  const pending=[];
  out.forEach(d=>(d.sites||[]).forEach(s=>{if(s.lat==null||s.lng==null)pending.push({d,s});}));
  if(pending.length===0)return{data:out,total:0,found:0};
  const ukPcs=[...new Set(pending.filter(x=>isUKPostcode(x.s.postcode)).map(x=>x.s.postcode))];
  if(ukPcs.length)await lookupUKPostcodes(ukPcs);
  let found=0;
  for(const{d,s}of pending){
    let ll=null;
    if(isUKPostcode(s.postcode))ll=GEO_CACHE[s.postcode]||null;
    else if((d.location==="USA"||/^[A-Za-z]{2}\s+\d{5}/.test(s.postcode))&&US_ZIP_RE.test(s.postcode))ll=await lookupUSZip(s.postcode.match(US_ZIP_RE)[1])||null;
    if(!ll&&(s.city||s.postcode)){
      const hasCountry=s.city.includes(",");
      if(s.city&&d.location==="UK"&&!hasCountry)ll=await lookupUKPlace(s.city)||null;
      else if(s.city&&d.location==="USA"&&US_STATE_CENTRE[s.city])ll=US_STATE_CENTRE[s.city];
      if(!ll){ /* overseas site, or a UK name postcodes.io does not know: "City, Country" as written; otherwise city and/or postcode plus the organisation's country */
        const country=d.location==="UK"?"United Kingdom":d.location;
        const place=[s.city,isUKPostcode(s.postcode)?"":s.postcode].filter(Boolean).join(" ");
        const known=!hasCountry&&d.location!=="Unknown"&&!!COUNTRY_CENTRE[d.location];
        const q=known?`${place}, ${country}`:place;
        /* a UK postcode that postcodes.io rejected is a typo, not a Nominatim query; when the country comes from the
           Location column the search is restricted to it, so "Munich" under a UK entry is reported rather than guessed */
        if(place)ll=await lookupNominatim(q,known?COUNTRY_ISO[d.location]:undefined)||null;
      }
    }
    if(ll){s.lat=ll[0];s.lng=ll[1];found++;}
  }
  /* Rows flagged by the parser (a postcode that could belong to more than one site by format, e.g.
     "Farnborough; Birmingham" with one postcode): look the city names up as well and give each
     postcode to the nearest city. Sites written as "City, Country" keep what they have. */
  const km=(a,b)=>{const r=Math.PI/180,x=(b[1]-a[1])*r*Math.cos((a[0]+b[0])*r/2),y=(b[0]-a[0])*r;return 6371*Math.sqrt(x*x+y*y);};
  for(const d of out.filter(d=>d.alignCheck)){
    delete d.alignCheck;
    const sites=d.sites||[];
    const plain=k=>!!sites[k].city&&!sites[k].city.includes(",");
    const cityLL=[];
    for(let k=0;k<sites.length;k++){let c=null;if(plain(k)){if(d.location==="UK")c=await lookupUKPlace(sites[k].city)||null;if(!c)c=await lookupNominatim(COUNTRY_CENTRE[d.location]?`${sites[k].city}, ${d.location==="UK"?"United Kingdom":d.location}`:sites[k].city,COUNTRY_ISO[d.location])||null;}cityLL.push(c);}
    const movable=sites.map((x,k)=>k).filter(k=>plain(k)&&sites[k].postcode&&sites[k].lat!=null);
    if(movable.length===0)continue;
    const pcs=movable.map(k=>({pc:sites[k].postcode,ll:[sites[k].lat,sites[k].lng],from:k}));
    movable.forEach(k=>{sites[k].postcode="";sites[k].lat=cityLL[k]?cityLL[k][0]:null;sites[k].lng=cityLL[k]?cityLL[k][1]:null;});
    const used=new Set();
    const place=(k,p)=>{sites[k].postcode=p.pc;sites[k].lat=p.ll[0];sites[k].lng=p.ll[1];used.add(k);};
    for(const p of pcs){let best=-1,bestKm=Infinity;sites.forEach((x,k)=>{if(used.has(k)||!plain(k)||!cityLL[k])return;const dist=km(p.ll,cityLL[k]);if(dist<bestKm){bestKm=dist;best=k;}});if(best>=0)place(best,p);else p.left=true;}
    for(const p of pcs.filter(p=>p.left)){const k=!used.has(p.from)?p.from:sites.findIndex((x,i)=>plain(i)&&!used.has(i));if(k>=0)place(k,p);}
  }
  return{data:out,total:pending.length,found};
}
/* Groups the current rows into map points. Pure; used by the Map tab and the tests. */
function buildMapPoints(rows){
  const byKey={};const overseas={};const ukNoCity=[],unknown=[],unlocated=[];
  rows.forEach(d=>{
    const located=(d.sites||[]).filter(s=>s.lat!=null&&s.lng!=null);
    (d.sites||[]).filter(s=>(s.lat==null||s.lng==null)&&(s.city||s.postcode)).forEach(s=>unlocated.push({d,site:s}));
    if(located.length){
      located.forEach(s=>{const key=s.lat.toFixed(4)+","+s.lng.toFixed(4);
        if(!byKey[key])byKey[key]={key,lat:s.lat,lng:s.lng,label:s.city||s.postcode||d.location,members:[],country:d.location};
        const pt=byKey[key];if(!pt.members.some(m=>m.d===d))pt.members.push({d,site:s});
        if(!pt.label&&(s.city||s.postcode))pt.label=s.city||s.postcode;
      });
    }else if(d.location==="UK"||/\bUK\b/.test(d.location))ukNoCity.push(d); /* "research in UK" counts as UK here */
    else if(d.location==="Unknown"||!COUNTRY_CENTRE[d.location])unknown.push(d);
    else{if(!overseas[d.location])overseas[d.location]={key:"country:"+d.location,lat:COUNTRY_CENTRE[d.location][0],lng:COUNTRY_CENTRE[d.location][1],label:d.location,members:[],country:d.location,hollow:true};overseas[d.location].members.push({d,site:null});}
  });
  const points=[...Object.values(byKey),...Object.values(overseas)];
  points.forEach(p=>{const secs=[...new Set(p.members.map(m=>m.d.sector))];p.sector=secs.length===1?secs[0]:"mixed";p.count=p.members.length;});
  points.sort((a,b)=>(a.hollow?1:0)-(b.hollow?1:0)||b.count-a.count||String(a.label).localeCompare(String(b.label))); /* real places first, country-only placeholders last */
  return{points,ukNoCity,unknown,unlocated};
}
/* ── Change ②: "Ecosystem at a Glance" computed from the loaded dataset ──
   Runs on the full dataset (not the filtered view), so cards update when a new
   CSV is uploaded but stay fixed while the user is filtering. */
const plural=(n,one,many)=>n===1?one:(many||one+"s");
const joinList=arr=>arr.length<=1?arr.join(""):arr.slice(0,-1).join(", ")+" and "+arr[arr.length-1];
function computeInsights(data){
  const total=data.length;
  const stageCount=s=>data.filter(d=>d.supplyChain.includes(s)).length;
  const stages=SC.map(s=>({stage:s,count:stageCount(s)}));
  /* Card 1 — End-user demand */
  const eu=stages.find(x=>x.stage==="End user").count;
  const euBy=SECTS.map(s=>({sector:s,count:data.filter(d=>d.sector===s&&d.supplyChain.includes("End user")).length})).filter(x=>x.count>0);
  const maxStage=Math.max(...stages.map(x=>x.count),0);
  const euDesc=eu===0?"No organisations are recorded at the End user stage in the current dataset.":
    `${eu} ${plural(eu,"organisation")} sit at the End user stage${eu===maxStage?", the most populated stage in the chain":""}`+
    (euBy.length>0?` (${joinList(euBy.map(x=>x.count+" "+SECT_LABELS[x.sector].toLowerCase()))}).`:".");
  /* Card 2 — Thinnest stage(s) */
  const minCount=Math.min(...stages.map(x=>x.count));
  const thin=stages.filter(x=>x.count===minCount).map(x=>x.stage);
  const rest=stages.filter(x=>x.count>minCount);
  const nextCount=rest.length?Math.min(...rest.map(x=>x.count)):null;
  const next=rest.filter(x=>x.count===nextCount).map(x=>x.stage);
  const ukThin=data.filter(d=>d.location==="UK"&&thin.some(s=>d.supplyChain.includes(s))).length;
  const thinDesc=total===0?"No data loaded.":
    `${joinList(thin)} ${thin.length>1?"have":"has"} the fewest players (${minCount})`+
    (next.length?`, followed by ${joinList(next)} (${nextCount}).`:".")+
    (minCount>0?` ${ukThin===0?"None":"Only "+ukThin} of ${thin.length>1?"these":"them"} ${ukThin===1?"is":"are"} UK-based.`:"");
  /* Card 3 — Academic coverage */
  const aca=data.filter(d=>d.sector==="Academic");
  const acaStages=SC.map(s=>({stage:s,count:aca.filter(d=>d.supplyChain.includes(s)).length}));
  const covered=acaStages.filter(x=>x.count>0).length;
  const top=[...acaStages].filter(x=>x.count>0).sort((a,b)=>b.count-a.count).slice(0,2);
  const acaDesc=aca.length===0?"No academic organisations in the current dataset.":
    `${aca.length} academic ${plural(aca.length,"group")} cover ${covered===SC.length?"the full chain":covered+" of "+SC.length+" stages"}`+
    (top.length?`, strongest at ${joinList(top.map(x=>x.stage+" ("+x.count+")"))}.`:".");
  /* Each card carries a membership predicate and a label so the Overview can open the organisation pop-up (change 6) */
  return[
    {icon:"🏭",title:"End-User Pull",desc:euDesc,color:C.teal,match:d=>d.supplyChain.includes("End user"),label:"End user stage",what:"is active at the End user stage"},
    {icon:"⚠️",title:thin.length>1?"Thinnest Stages":"Thinnest Stage: "+thin[0],desc:thinDesc,color:C.red,match:d=>thin.some(s=>d.supplyChain.includes(s)),label:joinList(thin)+(thin.length>1?" stages":" stage"),what:"is active at "+joinList(thin)},
    {icon:"🎓",title:"Academic Depth",desc:acaDesc,color:C.Academic,match:d=>d.sector==="Academic",label:"Academic organisations",what:"is an academic organisation"},
  ];
}

const KIND_CAP={cell:"Organisations behind this cell",bar:"Organisations behind this bar",card:"Organisations behind this card",pin:"Organisations at this location",list:"Organisations in this list"};

          </div>
          <button onClick={onClose} title="Close" style={{background:"transparent",border:"none",color:C.tm,cursor:"pointer",fontSize:20,padding:4,lineHeight:1}}>✕</button>

              {!filterOn&&isCell&&<div style={{fontSize:12,color:C.ts,marginTop:8}}>This is a gap across the whole ecosystem mapped so far.</div>}

/* "UK · Warrington WA4 4BT; Stone" for detail cards, table and pop-up rows */
const siteText=d=>(d.sites||[]).map(s=>[s.city,s.postcode].filter(Boolean).join(" ")).filter(Boolean).join("; ");
const cityText=d=>[...new Set((d.sites||[]).map(s=>s.city||s.postcode).filter(Boolean))].join("; ");
const placeText=(d,full)=>{const st=full?siteText(d):cityText(d);const loc=d.location==="Unknown"?"":d.location;return loc&&st?loc+" · "+st:loc||st;};

/* ── Map (change 7) ──
   Leaflet map with OpenStreetMap tiles. Defined outside App (a real component with hooks) and
   rendered by the Map tab; the tab function itself stays hook-free like the other tabs.
   points come from buildMapPoints(); each marker opens the organisation pop-up via onPoint. */
const UK_BOUNDS=[[49.8,-8.7],[59.0,2.0]];
const pinColor=p=>p.sector==="mixed"?C.tx:C[p.sector];
const escHtml=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function LeafletMap({points,view,onPoint}){
  const boxRef=useRef(null),mapRef=useRef(null),layerRef=useRef(null);
  const onPointRef=useRef(onPoint);onPointRef.current=onPoint;
  const hasL=typeof window!=="undefined"&&typeof window.L!=="undefined";
  useEffect(()=>{
    if(!hasL||!boxRef.current)return;
    const map=L.map(boxRef.current,{worldCopyJump:true,minZoom:2,scrollWheelZoom:false});
    /* tile.openstreetmap.org requires a valid Referer: tiles load from the GitHub Pages site or a local web server, but not from a file opened directly from disk (file://) */
    L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:18,referrerPolicy:"strict-origin-when-cross-origin",attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'}).addTo(map);
    map.fitBounds(UK_BOUNDS);
    map.on("focus",()=>map.scrollWheelZoom.enable());map.on("blur",()=>map.scrollWheelZoom.disable());
    mapRef.current=map;layerRef.current=L.layerGroup().addTo(map);
    return()=>{map.remove();mapRef.current=null;layerRef.current=null;};
  },[hasL]);
  useEffect(()=>{
    const map=mapRef.current,layer=layerRef.current;if(!map||!layer)return;
    layer.clearLayers();
    points.forEach(p=>{
      const size=p.count>=20?38:p.count>=10?34:p.count>=5?30:p.count>1?26:22;
      const col=pinColor(p);
      const html=`<div class="rw-pin${p.hollow?" hollow":""}" style="width:${size}px;height:${size}px;background:${col};color:${p.hollow?col:"#fff"}">${p.count>1?p.count:""}</div>`;
      const icon=L.divIcon({html,className:"",iconSize:[size,size],iconAnchor:[size/2,size/2]});
      const m=L.marker([p.lat,p.lng],{icon,title:""}).addTo(layer);
      const tip=`${escHtml(p.label)}: ${p.count} ${p.count===1?"organisation":"organisations"}`+(p.hollow?" (country only, no city yet)":"");
      m.bindTooltip(tip,{direction:"top",offset:[0,-size/2],className:"rw-tip"});
      m.on("click",()=>onPointRef.current(p));
    });
  },[points]);
  useEffect(()=>{ /* re-fit on UK / World only, so filtering does not undo the user's own zoom */
    const map=mapRef.current;if(!map)return;
    if(view==="uk"||points.length===0){map.fitBounds(UK_BOUNDS);return;}
    map.fitBounds(L.latLngBounds(points.map(p=>[p.lat,p.lng])).pad(0.15),{maxZoom:6});
  },[view]);
  if(!hasL)return <div style={{height:520,display:"flex",alignItems:"center",justifyContent:"center",color:C.tm,fontSize:13,textAlign:"center",padding:24}}>The map library could not be loaded (no connection to unpkg.com). The locations are still listed below.</div>;
  return <div ref={boxRef} style={{height:520,borderRadius:10,overflow:"hidden",border:`1px solid ${C.bl}`}}/>;
}

      /* change 7: look up coordinates for sites that have none, then swap the data in once */
      const seq=++uploadSeq.current;
      geocodeData(parsed).then(res=>{if(seq!==uploadSeq.current||res.total===0)return;setDATA(res.data);const missing=res.total-res.found;setUploadMsg({type:"success",text:`Loaded ${parsed.length} organisations from ${file.name}. Located ${res.found} of ${res.total} ${res.total===1?"site":"sites"} automatically`+(missing?`; ${missing} could not be found and ${missing===1?"is":"are"} listed beside the map.`:".")});}).catch(()=>{});

  const resetData=()=>{uploadSeq.current++;setDATA(DEFAULT_DATA);setDataSource("default");setUploadMsg({type:"success",text:"Reset to built-in dataset"});setSectF(null);setMatF(null);setScF(null);setSearch("");setSelOrg(null);};

          </div>
          <p style={{color:C.ts,fontSize:13,margin:"10px 0 12px",lineHeight:1.6}}>{selOrg.remit}</p>
          <div style={{display:"flex",gap:24,flexWrap:"wrap"}}>
            <div><div style={{fontSize:10,color:C.tm,fontWeight:700,textTransform:"uppercase",letterSpacing:1,marginBottom:5}}>Supply Chain</div><div style={{display:"flex",gap:4,flexWrap:"wrap"}}>{selOrg.supplyChain.length>0?selOrg.supplyChain.map(s=><Chip key={s} color={C.teal} filled sm>{s}</Chip>):<span style={{fontSize:11,color:C.tm}}>Not specified</span>}</div></div>
            <div><div style={{fontSize:10,color:C.tm,fontWeight:700,textTransform:"uppercase",letterSpacing:1,marginBottom:5}}>Materials</div><div style={{display:"flex",gap:4,flexWrap:"wrap"}}>{selOrg.materials.length>0?selOrg.materials.map(m=><Chip key={m} color={C[m]} filled sm>{MS[m]}</Chip>):<span style={{fontSize:11,color:C.tm}}>Not specified</span>}</div></div>

                <th key={h} style={{textAlign:"left",padding:"10px 14px",color:C.tm,fontSize:10,textTransform:"uppercase",letterSpacing:1.2,fontWeight:700,borderBottom:`2px solid ${C.bd}`}}>{h}</th>
              ))}
            </tr></thead>
            <tbody>{filtered.map((d,i)=>(
              <tr key={i} onClick={()=>setSelOrg(d)} style={{cursor:"pointer",borderBottom:`1px solid ${C.bl}`}} onMouseEnter={ev=>{ev.currentTarget.style.background=C.tg;}} onMouseLeave={ev=>{ev.currentTarget.style.background="transparent";}}>

                <td style={{padding:"10px 14px"}}><div style={{display:"flex",gap:3,flexWrap:"wrap"}}>{d.supplyChain.slice(0,2).map(s=><Chip key={s} color={C.teal} sm>{s}</Chip>)}{d.supplyChain.length>2&&<span style={{fontSize:10,color:C.tm}}>+{d.supplyChain.length-2}</span>}</div></td>
                <td style={{padding:"10px 14px"}}><div style={{display:"flex",gap:4}}>{d.materials.map(m=><span key={m} style={{width:10,height:10,borderRadius:"50%",background:C[m],display:"inline-block",border:"2px solid #fff",boxShadow:`0 0 0 1px ${C[m]}44`}} title={MS[m]}/>)}</div></td>
              </tr>

          </table>
        </div>
        {filtered.length>0&&<div style={{padding:14,textAlign:"center",color:C.tm,fontSize:12,borderTop:`1px solid ${C.bl}`}}>Showing {filtered.length} of {DATA.length} organisations</div>}
        {filtered.length===0&&<div style={{padding:48,textAlign:"center",color:C.tm}}>No matches. <button onClick={clearF} style={{color:C.teal,background:"none",border:"none",cursor:"pointer",fontWeight:600,textDecoration:"underline"}}>Reset</button></div>}
      </Card>
    </div>
  );

  const Gaps=()=>{
    const gaps=[],weak=[];
    SC.forEach(s=>MATS.forEach(m=>{const c=heat.mx[s]?.[m]||0;if(c===0)gaps.push({s,m});else if(c===1)weak.push({s,m});}));
    const gs=guideStep,tgt=gs>0?GUIDE_STEPS[gs-1].target:null;
    const listsEmpty=gaps.length===0&&weak.length===0;
    const guide=t=>tgt===t&&<GuideBox step={gs} total={GUIDE_STEPS.length} onNext={()=>setGuideStep(gs+1)} onBack={()=>setGuideStep(gs-1)} onClose={()=>setGuideStep(0)} hint={t==="gaps"&&listsEmpty?"Both lists are empty for the current selection. Select a sector above to see its gaps here, or press Done.":undefined}/>;
    const scopeLabel=sectF?SECT_LABELS[sectF]:null;
    const sectN=sectF?DATA.filter(d=>d.sector===sectF).length:DATA.length;
    const rowItem=(g,i,gap)=>(
      <div key={i} onClick={()=>{setPopup(cellPopup(g.s,g.m));guideAdvance(3);}} title="Show the organisations behind this cell" style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"8px 12px",background:gap?C.rb:C.ab,borderRadius:8,border:gap?`1px solid ${C.rr}`:"1px solid rgba(239,108,0,0.15)",cursor:"pointer"}} onMouseEnter={ev=>{ev.currentTarget.style.boxShadow=`0 0 0 2px ${gap?C.red:C.amb}55`;}} onMouseLeave={ev=>{ev.currentTarget.style.boxShadow="none";}}>
        <div><span style={{fontWeight:600,color:C.tx,fontSize:12}}>{g.s}</span><span style={{color:C.tm,fontSize:12}}> x </span><span style={{fontWeight:600,color:C[g.m],fontSize:12}}>{MS[g.m]}</span></div>
        <span style={{fontSize:9,fontWeight:800,padding:"2px 8px",borderRadius:99,background:gap?C.red:C.amb,color:"#fff",letterSpacing:gap?1:0}}>{gap?"GAP":"1 ONLY"}</span>
      </div>
    );
    return(
      <div>
        <div style={{display:"flex",alignItems:"flex-start",justifyContent:"space-between",gap:16,padding:"12px 16px",marginBottom:14,background:C.tg,border:`1px solid ${C.tb}`,borderLeft:`4px solid ${C.teal}`,borderRadius:10}}>
          <div style={{fontSize:12,color:C.ts,lineHeight:1.6}}>
            <strong style={{color:C.tx}}>{scopeLabel?`Showing gaps within ${scopeLabel} (${sectN} organisations).`:`Showing the whole ecosystem (${DATA.length} organisations).`}</strong>{" "}
            {scopeLabel?"Select another sector to compare, or Clear to return to the full picture. ":"Select a sector below to see the gaps within Industry, Academic or Supporting Bodies. "}Click any heatmap cell or list entry to see the organisations behind it.
          </div>
          <button onClick={()=>setGuideStep(gs>0?0:1)} style={{flexShrink:0,background:gs>0?C.teal:C.card,color:gs>0?"#fff":C.teal,border:`1.5px solid ${C.teal}`,borderRadius:8,padding:"6px 14px",fontSize:12,fontWeight:600,cursor:"pointer",whiteSpace:"nowrap"}}>{gs>0?"Hide guide":"Show guide"}</button>
        </div>
        <FilterBar hl={tgt==="filters"}/>
        {guide("filters")}
        <Card style={{marginBottom:18,...HL(tgt==="heatmap")}}>
          <STitle sub="Darker = more organisations. Red dashed = zero (gap). Amber = single player. Click a cell to list the organisations.">Supply Chain x Material Heatmap</STitle>
          {guide("heatmap")}
          <div style={{overflowX:"auto"}}>
            <table style={{width:"100%",borderCollapse:"separate",borderSpacing:5}}>
              <thead><tr><th style={{padding:10}}/>{MATS.map(m=><th key={m} style={{padding:10,textAlign:"center",fontSize:13,fontWeight:700,color:C[m]}}>{MS[m]}</th>)}<th style={{padding:10,textAlign:"center",fontSize:11,color:C.tm,fontWeight:700}}>Total</th></tr></thead>
              <tbody>{SC.map(s=>{const total=filtered.filter(d=>d.supplyChain.includes(s)).length;return(<tr key={s}><td style={{padding:"10px 14px",color:C.tx,fontSize:13,fontWeight:600,whiteSpace:"nowrap"}}>{s}</td>{MATS.map(m=><HeatCell key={m} count={heat.mx[s]?.[m]||0} max={heat.max} onClick={()=>{setPopup(cellPopup(s,m));guideAdvance(2);}} title={`${s} x ${MS[m]}: click to list organisations`}/>)}<td onClick={()=>setPopup(stagePopup(s))} title={`${s}: ${total}, click to list organisations`} style={{padding:"10px 14px",textAlign:"center",color:C.tm,fontSize:14,fontWeight:700,fontFamily:mn,cursor:"pointer"}}>{total}</td></tr>);})}</tbody>
            </table>
          </div>
        </Card>
        {guide("gaps")}
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:16,...HL(tgt==="gaps")}}>
          <Card><STitle sub={gaps.length+" zero-player combinations"}>Critical Gaps</STitle><div style={{display:"flex",flexDirection:"column",gap:6}}>{gaps.length>0?gaps.map((g,i)=>rowItem(g,i,true)):<p style={{color:C.tm,fontSize:12,margin:0}}>None with current filters.</p>}</div></Card>
          <Card><STitle sub={weak.length+" single-player combinations"}>Vulnerable Areas</STitle><div style={{display:"flex",flexDirection:"column",gap:6}}>{weak.length>0?weak.map((g,i)=>rowItem(g,i,false)):<p style={{color:C.tm,fontSize:12,margin:0}}>None with current filters.</p>}</div></Card>
        </div>
      </div>
    );
  };

  const ChainTab=()=>{
    const locData={};filtered.forEach(d=>{const l=d.location==="Unknown"?"Unspecified":d.location;locData[l]=(locData[l]||0)+1;});
    const locBar=Object.entries(locData).sort((a,b)=>b[1]-a[1]).map(([n,v])=>({label:n,loc:n==="Unspecified"?"Unknown":n,value:v,color:n==="UK"?C.teal:n==="Unspecified"?C.bd:C.Academic}));
    const maxSc=Math.max(...SC.map(s=>filtered.filter(d=>d.supplyChain.includes(s)).length),1);
    return(
      <div>
        <FilterBar/>
        <Card style={{marginBottom:18}}>
          <STitle sub="Upstream to Downstream. Red = low-density stages. Click a bar to list the organisations.">Supply Chain Pipeline</STitle>
          <div style={{display:"flex",flexDirection:"column",gap:3,marginTop:8}}>
            {SC.map(s=>{const count=filtered.filter(d=>d.supplyChain.includes(s)).length;const pct=(count/maxSc)*100;const isWeak=count<10;return(
              <div key={s} onClick={()=>setPopup(stagePopup(s))} title={`${s}: ${count}, click to list organisations`} style={{display:"flex",alignItems:"center",gap:12,cursor:"pointer",borderRadius:8,padding:"2px 4px"}} onMouseEnter={ev=>{ev.currentTarget.style.background=C.tg;}} onMouseLeave={ev=>{ev.currentTarget.style.background="transparent";}}>
                <div style={{width:110,fontSize:12,color:C.ts,textAlign:"right",fontWeight:600,flexShrink:0}}>{s}</div>
                <div style={{flex:1,height:32,background:C.bg,borderRadius:6,overflow:"hidden",border:`1px solid ${C.bl}`}}>
                  <div style={{width:Math.max(pct,3)+"%",height:"100%",borderRadius:5,background:isWeak?`linear-gradient(90deg,${C.red}cc,${C.red}88)`:`linear-gradient(90deg,${C.teal},${C.tl})`,display:"flex",alignItems:"center",paddingLeft:10,transition:"width 0.5s"}}>
                    <span style={{fontSize:12,fontWeight:700,color:"#fff",fontFamily:mn}}>{count}</span>
                  </div>
                </div>
                {isWeak?<span style={{fontSize:9,fontWeight:700,color:C.red,background:C.rb,padding:"2px 7px",borderRadius:99,whiteSpace:"nowrap"}}>Low density</span>:<span style={{width:68}}/>}
              </div>
            );})}
          </div>
        </Card>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:16}}>
          <Card><STitle sub="HQ or significant presence. Click a bar to list the organisations.">Geographic Distribution</STitle><HBar data={locBar} onClick={i=>setPopup(locationPopup(locBar[i].loc))}/></Card>
          <Card><STitle sub="Organisations spanning 3+ stages. Click a row to open it in the Explorer.">Top Vertically-Integrated Players</STitle>
            <div style={{display:"flex",flexDirection:"column",gap:4}}>
              {[...filtered].filter(d=>d.supplyChain.length>=3).sort((a,b)=>b.supplyChain.length-a.supplyChain.length).slice(0,10).map((d,i)=>(
                <div key={i} onClick={()=>openOrg(d)} title="Open in Explorer" style={{display:"flex",alignItems:"center",gap:10,padding:"6px 10px",borderRadius:6,background:i%2===0?C.tg:"transparent",cursor:"pointer"}} onMouseEnter={ev=>{ev.currentTarget.style.boxShadow=`inset 0 0 0 2px ${C.teal}55`;}} onMouseLeave={ev=>{ev.currentTarget.style.boxShadow="none";}}>
                  <span style={{fontSize:12,fontWeight:600,color:C.tx,minWidth:140}}>{d.name}</span>
                  <div style={{display:"flex",gap:3,flexWrap:"wrap",flex:1}}>{d.supplyChain.map(s=><Chip key={s} color={C.teal} sm>{s}</Chip>)}</div>
                  <Chip color={C[d.sector]} filled sm>{SECT_LABELS[d.sector]||d.sector}</Chip>
                </div>
              ))}
            </div>
          </Card>
        </div>
      </div>
    );
  };

  /* ── Map tab (change 7) ── hook-free like the other tabs; LeafletMap holds the hooks */
  const MapTab=()=>{
    const{points,ukNoCity,unknown,unlocated}=mapData;
    const unlocatedOrgs=[...new Set(unlocated.map(x=>x.d))];
    const solid=points.filter(p=>!p.hollow),hollow=points.filter(p=>p.hollow);
    const plotted=new Set();solid.forEach(p=>p.members.forEach(m=>plotted.add(m.d)));
    /* the list groups markers by place name (several postcodes in one city → one row) */
    const places={};points.forEach(p=>{const k=(p.hollow?"country:":"")+p.label+"|"+p.country;if(!places[k])places[k]={key:k,label:p.label,country:p.country,hollow:p.hollow,sector:p.sector,members:[]};const pl=places[k];p.members.forEach(m=>{if(!pl.members.some(x=>x.d===m.d))pl.members.push(m);});if(pl.sector!==p.sector)pl.sector="mixed";});
    const placeList=Object.values(places).map(pl=>({...pl,count:pl.members.length})).sort((a,b)=>(a.hollow?1:0)-(b.hollow?1:0)||b.count-a.count||a.label.localeCompare(b.label));
    const byCountry=new Set();hollow.forEach(p=>p.members.forEach(m=>byCountry.add(m.d)));
    const toggle=(id,label)=><button key={id} onClick={()=>setMapView(id)} style={{background:mapView===id?C.teal:C.card,color:mapView===id?"#fff":C.teal,border:`1.5px solid ${C.teal}`,borderRadius:8,padding:"5px 14px",fontSize:12,fontWeight:600,cursor:"pointer"}}>{label}</button>;
    const legend=[["Industry",C.Industry],["Academic",C.Academic],["Supporting Bodies",C.Other],["Mixed",C.tx]];
    const row=(key,label,sub,count,color,onClick,dashed)=>(
      <div key={key} onClick={onClick} title="Click to list the organisations" style={{display:"flex",alignItems:"center",gap:10,padding:"7px 10px",borderRadius:8,cursor:"pointer",borderBottom:`1px solid ${C.bl}`}} onMouseEnter={ev=>{ev.currentTarget.style.background=C.tg;}} onMouseLeave={ev=>{ev.currentTarget.style.background="transparent";}}>
        <span style={{width:12,height:12,borderRadius:"50%",flexShrink:0,background:dashed?"transparent":color,border:dashed?`2px dashed ${color}`:"none"}}/>
        <span style={{flex:1,fontSize:12,color:C.tx,fontWeight:600,minWidth:0,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{label}{sub&&<span style={{color:C.tm,fontWeight:400,marginLeft:6}}>{sub}</span>}</span>
        <span style={{fontSize:13,fontWeight:700,fontFamily:mn,color:C.tx}}>{count}</span>
      </div>
    );
    return(
      <div>
        <FilterBar/>
        <Card style={{marginBottom:18}}>
          <STitle sub="Each marker is a site; the number shows how many organisations share it. Click a marker to list them. Dashed markers stand for countries where no city has been recorded yet.">Ecosystem Map</STitle>
          <div style={{display:"flex",alignItems:"center",gap:8,flexWrap:"wrap",marginBottom:12}}>
            {toggle("uk","UK")}{toggle("world","World")}
            <span style={{width:1,height:18,background:C.bd,margin:"0 6px"}}/>
            {legend.map(([l,c])=><span key={l} style={{display:"flex",alignItems:"center",gap:4,fontSize:11,color:C.ts}}><span style={{width:10,height:10,borderRadius:"50%",background:c,display:"inline-block"}}/>{l}</span>)}
            <span style={{marginLeft:"auto",fontSize:12,color:C.tm}}><strong style={{color:C.teal,fontFamily:mn}}>{plotted.size}</strong> organisations at <strong style={{color:C.teal,fontFamily:mn}}>{solid.length}</strong> {solid.length===1?"place":"places"}{byCountry.size>0&&<span>; <strong style={{color:C.ts,fontFamily:mn}}>{byCountry.size}</strong> by country only</span>}</span>
          </div>
          <LeafletMap points={points} view={mapView} onPoint={p=>setPopup(pinPopup(p))}/>
        </Card>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:16}}>
          <Card><STitle sub="Every place on the map for the current selection, grouped by city, most organisations first. Click a row to list them.">Locations</STitle>
            <div style={{maxHeight:360,overflowY:"auto"}}>
              {placeList.length===0?<p style={{color:C.tm,fontSize:12,margin:0}}>No located organisation in the current selection.</p>:placeList.map(p=>row(p.key,p.label,p.hollow?"country only":(p.country&&p.country!=="UK"&&!p.label.includes(",")?p.country:null),p.count,pinColor(p),()=>setPopup(pinPopup(p)),p.hollow))}
            </div>
          </Card>
          <Card><STitle sub="Organisations with no city or postcode yet, and sites whose city or postcode could not be looked up (an overseas city, or a postcode that does not exist).">Not Yet on the Map</STitle>
            {ukNoCity.length===0&&unknown.length===0&&unlocated.length===0?<p style={{color:C.tm,fontSize:12,margin:0}}>Every organisation in the current selection is on the map.</p>:(
              <div>
                {ukNoCity.length>0&&row("uknocity","UK, city not recorded",null,ukNoCity.length,C.teal,()=>setPopup(unplacedPopup("UK, city not recorded",ukNoCity,"is UK-based without a recorded city")),true)}
                {unknown.length>0&&row("unknown","Location not specified",null,unknown.length,C.tm,()=>setPopup(unplacedPopup("Location not specified",unknown,"has an unspecified location")),true)}
                {unlocated.length>0&&row("unlocated","Sites that could not be located",unlocated.map(x=>x.site.city||x.site.postcode).slice(0,4).join(", ")+(unlocated.length>4?" …":""),unlocated.length,C.amb,()=>setPopup(unplacedPopup("Sites that could not be located",unlocatedOrgs,"has a site that could not be located")),true)}
              </div>
            )}
            <p style={{fontSize:11,color:C.tm,margin:"12px 0 0",lineHeight:1.6}}>Coordinates are looked up automatically when a CSV is uploaded (UK postcodes and place names via postcodes.io, US ZIP codes via zippopotam.us, other places via OpenStreetMap Nominatim) and saved in the exported CSV, so each site is looked up once.</p>
          </Card>
        </div>
      </div>
    );
  };

  const DataTab=()=>(
    <div>
      <Card style={{marginBottom:18,background:dataSource==="default"?C.tg:C.gb,borderLeft:`4px solid ${dataSource==="default"?C.teal:C.green}`}}>
        <div style={{display:"flex",alignItems:"center",justifyContent:"space-between"}}>
          <div>
            <div style={{fontSize:14,fontWeight:700,color:C.tx}}>Current Data Source</div>
            <div style={{fontSize:13,color:C.ts,marginTop:2}}>{dataSource==="default"?`Built-in dataset: ${DATA.length} organisations`:`Custom CSV: ${dataSource} (${DATA.length} organisations)`}</div>
          </div>
          {dataSource!=="default"&&<button onClick={resetData} style={{background:C.card,color:C.teal,border:`1.5px solid ${C.teal}`,borderRadius:8,padding:"7px 16px",fontSize:12,fontWeight:600,cursor:"pointer"}}>Reset to Default</button>}
        </div>
      </Card>
      {uploadMsg&&(<div style={{marginBottom:16,padding:"12px 16px",borderRadius:10,background:uploadMsg.type==="success"?C.gb:C.rb,border:`1px solid ${uploadMsg.type==="success"?"rgba(46,125,50,0.15)":C.rr}`,display:"flex",justifyContent:"space-between",alignItems:"center"}}><span style={{fontSize:13,color:uploadMsg.type==="success"?C.green:C.red,fontWeight:500}}>{uploadMsg.text}</span><button onClick={()=>setUploadMsg(null)} style={{background:"none",border:"none",color:C.tm,cursor:"pointer",fontSize:16}}>✕</button></div>)}
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:16,marginBottom:20}}>
        <Card>
          <STitle sub="Upload a CSV to replace the dataset. All charts update instantly.">Upload New Data</STitle>
          <div onDragOver={ev=>{ev.preventDefault();setDragOver(true);}} onDragLeave={()=>setDragOver(false)} onDrop={handleDrop} onClick={()=>fileRef.current?.click()} style={{border:`2px dashed ${dragOver?C.teal:C.bd}`,borderRadius:12,padding:"40px 24px",textAlign:"center",cursor:"pointer",background:dragOver?"rgba(0,131,143,0.04)":"transparent"}}>
            <input ref={fileRef} type="file" accept=".csv" style={{display:"none"}} onChange={ev=>{if(ev.target.files?.[0])handleCSV(ev.target.files[0]);ev.target.value="";}}/>
            <div style={{fontSize:36,marginBottom:8}}>📄</div>
            <div style={{fontSize:14,fontWeight:600,color:C.tx}}>{dragOver?"Drop CSV here":"Drag and drop a CSV file"}</div>
            <div style={{fontSize:12,color:C.tm,marginTop:4}}>or click to browse</div>
          </div>
        </Card>
        <Card>
          <STitle sub="Download for updating or sharing">Download Options</STitle>
          <div style={{display:"flex",flexDirection:"column",gap:10}}>
            <button onClick={()=>dlFile(genTemplate(),"rewire_template.csv")} style={{display:"flex",alignItems:"center",gap:12,padding:"14px 18px",background:C.tg,border:`1.5px solid ${C.tb}`,borderRadius:10,cursor:"pointer",textAlign:"left"}}>
              <span style={{fontSize:28}}>📋</span><div><div style={{fontSize:13,fontWeight:700,color:C.teal}}>Download Blank Template</div><div style={{fontSize:11,color:C.ts}}>Empty CSV with example row (City and Postcode included)</div></div>
            </button>
            <button onClick={()=>dlFile(dataToCSV(DATA),"rewire_ecosystem_data.csv")} style={{display:"flex",alignItems:"center",gap:12,padding:"14px 18px",background:C.tg,border:`1.5px solid ${C.tb}`,borderRadius:10,cursor:"pointer",textAlign:"left"}}>
              <span style={{fontSize:28}}>💾</span><div><div style={{fontSize:13,fontWeight:700,color:C.teal}}>Export Current Data</div><div style={{fontSize:11,color:C.ts}}>All {DATA.length} organisations as CSV</div></div>
            </button>
          </div>
        </Card>
      </div>
    </div>
  );

  return(
    <div style={{minHeight:"100vh",background:C.bg,color:C.tx,fontFamily:ft}}>
      <div style={{background:"#fff",borderBottom:`1px solid ${C.bd}`,padding:"0 32px"}}>
        <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"16px 0 0"}}>
          <div style={{display:"flex",alignItems:"center",gap:14}}>
            <div style={{width:42,height:42,borderRadius:10,background:`linear-gradient(135deg,${C.teal},${C.td})`,display:"flex",alignItems:"center",justifyContent:"center",boxShadow:`0 2px 8px ${C.teal}40`}}><span style={{fontSize:22,fontWeight:800,color:"#fff",fontFamily:mn}}>R</span></div>
            <div><h1 style={{margin:0,fontSize:19,fontWeight:700,color:C.tx,letterSpacing:-0.3}}>REWIRE Ecosystem Explorer</h1><p style={{margin:0,fontSize:12,color:C.tm}}>UK Wide Band Gap Power Semiconductor Landscape</p></div>
          </div>
          <div style={{display:"flex",alignItems:"center",gap:16}}>
            {dataSource!=="default"&&<Chip color={C.green} filled sm>Custom Data</Chip>}
            <div style={{textAlign:"right"}}><div style={{fontSize:10,color:C.tm,textTransform:"uppercase",letterSpacing:1}}>Organisations</div><div style={{fontSize:22,fontWeight:800,color:C.teal,fontFamily:mn}}>{DATA.length}</div></div>
          </div>
        </div>
        <div style={{display:"flex",gap:0,marginTop:12}}>
          {TABS.map(t=>(<button key={t.id} onClick={()=>goTab(t.id)} style={{padding:"10px 22px",background:"transparent",border:"none",borderBottom:tab===t.id?`3px solid ${C.teal}`:"3px solid transparent",color:tab===t.id?C.teal:C.tm,fontSize:13,fontWeight:tab===t.id?700:500,cursor:"pointer",transition:"all 0.15s"}}>{t.label}</button>))}
        </div>
      </div>
      <div style={{padding:"22px 32px 32px",maxWidth:1200,margin:"0 auto"}}>
        {tab==="overview"&&Overview()}
        {tab==="explorer"&&Explorer()}
        {tab==="gaps"&&Gaps()}
        {tab==="chain"&&ChainTab()}
        {tab==="map"&&MapTab()}
        {tab==="data"&&DataTab()}
      </div>
      {popup&&<OrgPopup popup={popup} filtered={filtered} DATA={DATA} sectF={sectF} matF={matF} scF={scF} search={search} onClose={closePopup} onOpenOrg={openOrg}/>}
      <div style={{padding:"14px 32px",borderTop:`1px solid ${C.bd}`,background:"#fff",textAlign:"center",fontSize:10,color:C.tm}}>
        REWIRE Innovation and Knowledge Centre - University of Bristol - Student Challenge 2026
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
